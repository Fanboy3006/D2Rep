# Offline build mode for network-restricted machines: all crates resolve from
# the local vendored mirror (vendor/ at the project root, relative to this
# config file). Kept machine-independent on purpose. Networked machines that
# need crates.io directly can comment this out (see repo history / other
# machine's toggling workflow); run setup.ps1 after restoring to re-verify.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
