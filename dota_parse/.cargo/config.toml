# Offline build mode for network-restricted machines: all crates resolve from
# the local vendored mirror at <project-root>/vendor (one level up from this
# dota_parse/, i.e. "../vendor" relative to this config file's base dir).
# Machine-independent on purpose; networked machines can comment this out to
# use crates.io directly.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "../vendor"
